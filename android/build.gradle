group = "com.souvikbiswas.video_trimmer"
version = "1.0"

// Plain Java on purpose: it builds the same under AGP 8 and AGP 9 without
// depending on how the host app configures Kotlin.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.souvikbiswas.video_trimmer"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        // video_player_android already requires 24, so apps cannot go lower.
        minSdk = 24
    }
}

dependencies {
    // Keep in step with the Media3 version video_player_android uses: all
    // Media3 modules in an app must share one version.
    def media3Version = "1.9.2"
    implementation("androidx.media3:media3-transformer:$media3Version")
    implementation("androidx.media3:media3-common:$media3Version")
    implementation("androidx.annotation:annotation-experimental:1.4.1")
}
