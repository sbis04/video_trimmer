name: video_trimmer
description: A Flutter package for trimming videos. This supports retrieving, trimming, and storage of trimmed video files to the file system.
version: 6.0.0
homepage: https://github.com/sbis04/video_trimmer
repository: https://github.com/sbis04/video_trimmer
issue_tracker: https://github.com/sbis04/video_trimmer/issues
topics:
  - video
  - trimmer
  - video-editing
  - media

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.9.5
  flutter_native_video_trimmer: ^1.1.9
  path_provider: ^2.1.5
  intl: ">=0.19.0 <0.21.0"
  path: ^1.9.0
  transparent_image: ^2.0.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.souvikbiswas.video_trimmer
        pluginClass: VideoTrimmerThumbnailsPlugin
      ios:
        pluginClass: VideoTrimmerThumbnailsPlugin
