name: video_trimmer
description: Trim videos in Flutter on Android, iOS, macOS, and the web, with a customizable trim viewer, playback controls, and video or GIF output.
version: 6.0.0
homepage: https://github.com/sbis04/video_trimmer
repository: https://github.com/sbis04/video_trimmer
issue_tracker: https://github.com/sbis04/video_trimmer/issues
topics:
  - video
  - trimmer
  - video-editing
  - media

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0

  video_player: ^2.9.5
  path_provider: ^2.1.5
  path: ^1.9.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.souvikbiswas.video_trimmer
        pluginClass: VideoTrimmerNativePlugin
      ios:
        pluginClass: VideoTrimmerNativePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: VideoTrimmerNativePlugin
        sharedDarwinSource: true
      web:
        pluginClass: VideoTrimmerWeb
        fileName: src/web/video_trimmer_web.dart
